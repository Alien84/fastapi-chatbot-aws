name: CI

on:
  push:
  #   branches: [ main, dev ]
  # pull_request:
  #   branches: [ main, dev ]

# Required permissions for OIDC token
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555576841436:role/GitHubActionsRole  # Replace with your account ID
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-CI-${{ github.run_id }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          
      # - name: Lint with flake8
      #   run: |
      #     pip install flake8
      #     flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
      
      # - name: Test application
      #   run: |
      #     pip install pytest pytest-cov httpx
      #     pytest tests/api/ --cov=app
    
      # - name: Test with pytest
      #   run: |
      #     pytest tests/ --cov=app
          
      - name: Preview Pulumi Changes
        uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: dev
          work-dir: infrastructure
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # REMOVE THESE LINES - AWS credentials are configured automatically using IAM Role
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: ${{ secrets.AWS_REGION }}  # Keep this if Pulumi needs it explicitly
          AWS_REGION: ${{ secrets.AWS_REGION }}

