name: CD

on:
  push:
    branches:
      - main    # Production
      - staging # Staging
      - dev # Development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

# ADD THIS: Required permissions for OIDC token
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout


jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Determine environment based on branch or input
    steps:
      - name: Set environment based on branch or input
        id: set-environment
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi
      
      - uses: actions/checkout@v3

      # ADD THIS: Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555576841436:role/GitHubActionsRole  # Replace with your account ID
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
    #   - name: Run unit tests
    #     run: |
    #       pip install pytest
    #       pytest tests/

      - name: Create stack if it doesn't exist
        run: |
            cd infrastructure
            if ! pulumi stack select ${{ env.ENVIRONMENT }} 2>/dev/null; then
            pulumi stack init ${{ env.ENVIRONMENT }}
            pulumi config set aws:region ${{ secrets.AWS_REGION }}
            # Add other default configurations here
            fi
        env:
            PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          
      - name: Deploy with Pulumi
        uses: pulumi/actions@v4
        with:
          command: up
          stack-name: ${{ env.ENVIRONMENT }}
          work-dir: infrastructure
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # REMOVE THESE LINES - AWS credentials are now configured automatically
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: ${{ secrets.AWS_REGION }}  # Keep this if Pulumi needs it explicitly
          AWS_REGION: ${{ secrets.AWS_REGION }}
          
      - name: Send deployment notification
        if: success()
        uses: rtCamp/action-slack-notify@v2
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: deployments
          SLACK_COLOR: good
          SLACK_TITLE: "Deployment Successful: ${{ env.ENVIRONMENT }}"
          SLACK_MESSAGE: "FastAPI chatbot deployed to ${{ env.ENVIRONMENT }} environment successfully"
          SLACK_ICON: https://github.com/pulumi/pulumi/blob/master/favicon.ico