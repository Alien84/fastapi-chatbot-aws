name: CD with Docker

on:
  # push:
  #   branches:
  #     - main    # Production
  #     - staging # Staging
  #     - dev # Development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        type: string
      # deploy_stage:
      #   description: 'Deployment stage'
      #   required: true
      #   default: 'ecr'
      #   type: choice
      #   options: [ecr, lambda, all]

# Required permissions for OIDC token
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Set environment based on branch or input
        id: set-environment
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENVIRONMENT="prod"
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="dev"
          fi
          echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_ENV
          echo "Selected environment: ${ENVIRONMENT}"

      # Production deployment confirmation check
      - name: Validate production deployment confirmation
        if: env.ENVIRONMENT == 'prod' && github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Production deployment requires confirmation. Please type 'DEPLOY' in the confirm field."
            exit 1
          fi
          echo "✅ Production deployment confirmed"

      - name: Log deployment details
        run: |
          echo "🚀 Deploying to environment: ${{ env.ENVIRONMENT }}"
          echo "Requested by: ${{ github.actor }}"
          echo "Timestamp: $(date)"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
      # Add production deployment protection
      - name: Production deployment check
        if: env.ENVIRONMENT == 'prod'
        run: |
          echo "::warning::Deploying to production environment"
          echo "This deployment requires manual approval in GitHub Actions"
      
      - uses: actions/checkout@v4

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::555576841436:role/GitHubActionsRole  # Replace with your account ID
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-CD-${{ github.run_id }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Install Pulumi CLI
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: 'latest'

      # Test the application before building
      # - name: Run application tests
      #   run: |
      #     pip install pytest pytest-cov httpx
      #     pytest tests/ --cov=app
      #   continue-on-error: false

      - name: Create stack if it doesn't exist
        run: |
            cd infrastructure
            if ! pulumi stack select ${{ env.ENVIRONMENT }} 2>/dev/null; then
              echo "Creating new stack: ${{ env.ENVIRONMENT }}"
              pulumi stack init ${{ env.ENVIRONMENT }}
              pulumi config set aws:region ${{ secrets.AWS_REGION }}
              # Add other default configurations here
            else
              echo "Stack ${{ env.ENVIRONMENT }} already exists"
              # Ensure the region is set even for existing stacks
              pulumi config set aws:region ${{ secrets.AWS_REGION }}
            fi
        env:
            PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # STEP 3: Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Set the pulumi environment variable for initial ECR deployment (This is set for lambda ecr, can bb extended for other ecrs)
      - name: Set Pulumi config for initial ECR deployment
        run: |
          cd infrastructure
          pulumi config set deploy_stage ecr --stack ${{ env.ENVIRONMENT }}
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Deploy infrastructure first to ensure ECR repository exists
      - name: Deploy initial Lambda ECR infrastructure with Pulumi
        id: deploy-ecr-infrastructure
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ env.ENVIRONMENT }}
          work-dir: infrastructure

        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # REMOVE THESE LINES - AWS credentials are configured automatically using IAM Role
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: ${{ secrets.AWS_REGION }}  # Keep this if Pulumi needs it explicitly
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      
      
      # Get ECR repository URL from Pulumi output
      - name: Get Lambda ECR repository URL
        id: get-lambda-ecr-url
        run: |
          cd infrastructure
          pulumi stack select ${{ env.ENVIRONMENT }}
          LAMBDA_ECR_URL=$(pulumi stack output lambda_ecr_repo_url)
          echo "LAMBDA_ECR_URL=$LAMBDA_ECR_URL" >> $GITHUB_ENV
          echo "LAMBDA ECR repository URL: $LAMBDA_ECR_URL"
          
          # Also extract the repository name for cleanup purposes
          LAMBDA_ECR_REPO_NAME=$(echo $LAMBDA_ECR_URL | cut -d'/' -f2)
          echo "LAMBDA_ECR_REPO_NAME=$LAMBDA_ECR_REPO_NAME" >> $GITHUB_ENV
          echo "ECR repository name: $LAMBDA_ECR_REPO_NAME"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}


      # Build and push Docker image
      - name: Build and push Docker Lambda image
        id: build-push-Lambda
        run: |
          cd lambda_functions/message_processor
          
          # Create image tags
          LAMBDA_IMAGE_TAG_LATEST="${{ env.LAMBDA_ECR_URL }}:latest"
          LAMBDA_IMAGE_TAG_COMMIT="${{ env.LAMBDA_ECR_URL }}:${{ github.sha }}"
          LAMBDA_IMAGE_TAG_ENV="${{ env.LAMBDA_ECR_URL }}:${{ env.ENVIRONMENT }}-latest"
          
          echo "Building Docker Lambda image..."
          echo "Latest tag: $LAMBDA_IMAGE_TAG_LATEST"
          echo "Commit tag: $LAMBDA_IMAGE_TAG_COMMIT"
          echo "Environment tag: $LAMBDA_IMAGE_TAG_ENV"
          
          # Build the Docker image with multiple tags
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg VERSION=${{ env.ENVIRONMENT }}-${{ github.sha }} \
            -t temp-lambda-image \
            --load \
            .

          # Tag the image with all required tags
          docker tag temp-lambda-image $LAMBDA_IMAGE_TAG_LATEST
          docker tag temp-lambda-image $LAMBDA_IMAGE_TAG_COMMIT
          docker tag temp-lambda-image $LAMBDA_IMAGE_TAG_ENV
          
          # Push all tags
          echo "Pushing Docker images..."
          docker push $LAMBDA_IMAGE_TAG_LATEST
          docker push $LAMBDA_IMAGE_TAG_COMMIT
          docker push $LAMBDA_IMAGE_TAG_ENV

          # Clean up local temp image
          docker rmi temp-lambda-image || true

          echo "Docker image pushed successfully"
          
          # Set output for later steps
          echo "LAMBDA_IMAGE_URI=$LAMBDA_IMAGE_TAG_LATEST" >> $GITHUB_ENV
          echo "LAMBDA_IMAGE_TAG=latest" >> $GITHUB_ENV
          echo "Lambda Image URI: $LAMBDA_IMAGE_TAG_LATEST"

          echo "Waiting 10 seconds for ECR to process the images..."
          sleep 10
          echo "Build and push for lambda function process completed"


      # Set the pulumi environment variable for final deployment
      - name: Set Pulumi config for final deployment
        run: |
          cd infrastructure
          PROJECT_NAME=$(grep '^name:' Pulumi.yaml | awk '{print $2}' | tr -d '"')
          pulumi config set ${PROJECT_NAME}:deploy_stage lambda --stack ${{ env.ENVIRONMENT }}
          pulumi config set ${PROJECT_NAME}:lambda_image_tag ${{ env.LAMBDA_IMAGE_TAG }} --stack ${{ env.ENVIRONMENT }}
          pulumi config set ${PROJECT_NAME}:lambda_image_uri ${{ env.LAMBDA_IMAGE_URI }} --stack ${{ env.ENVIRONMENT }}

        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      
      # Deploy infrastructure first to ensure ECR repository exists
      - name: Deploy infrastructure with Pulumi
        id: deploy-infrastructure
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ env.ENVIRONMENT }}
          work-dir: infrastructure
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          # REMOVE THESE LINES - AWS credentials are configured automatically using IAM Role
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: ${{ secrets.AWS_REGION }}  # Keep this if Pulumi needs it explicitly
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      # Get ECR repository URL from Pulumi output
      - name: Get ECR repository URL
        id: get-ecr-url
        run: |
          cd infrastructure
          pulumi stack select ${{ env.ENVIRONMENT }}
          ECR_URL=$(pulumi stack output ecr_repository_url)
          echo "ECR_URL=$ECR_URL" >> $GITHUB_ENV
          echo "ECR repository URL: $ECR_URL"
          
          # Also extract the repository name for cleanup purposes
          ECR_REPO_NAME=$(echo $ECR_URL | cut -d'/' -f2)
          echo "ECR_REPO_NAME=$ECR_REPO_NAME" >> $GITHUB_ENV
          echo "ECR repository name: $ECR_REPO_NAME"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      

      # Build and push Docker image
      - name: Build and push Docker image
        id: build-push
        run: |
          cd app
          
          # Create image tags
          IMAGE_TAG_LATEST="${{ env.ECR_URL }}:latest"
          IMAGE_TAG_COMMIT="${{ env.ECR_URL }}:${{ github.sha }}"
          IMAGE_TAG_ENV="${{ env.ECR_URL }}:${{ env.ENVIRONMENT }}-latest"
          
          echo "Building Docker image..."
          echo "Latest tag: $IMAGE_TAG_LATEST"
          echo "Commit tag: $IMAGE_TAG_COMMIT"
          echo "Environment tag: $IMAGE_TAG_ENV"
          
          # Build the Docker image with multiple tags
          docker build \
            -t $IMAGE_TAG_LATEST \
            -t $IMAGE_TAG_COMMIT \
            -t $IMAGE_TAG_ENV \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg VERSION=${{ env.ENVIRONMENT }}-${{ github.sha }} \
            .
          
          # Push all tags
          echo "Pushing Docker images..."
          docker push $IMAGE_TAG_LATEST
          docker push $IMAGE_TAG_COMMIT
          docker push $IMAGE_TAG_ENV

          echo "Docker image pushed successfully"
          echo "IMAGE_URI=$ECR_URL:${{ github.sha }}" >> $GITHUB_ENV
          
          # Set output for later steps
          echo "IMAGE_URI=$IMAGE_TAG_LATEST" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV


      # Trigger application deployment on EC2 instances
      - name: Trigger application deployment
        id: deploy-app
        run: |
          echo "Triggering deployment of new container image..."
          
          # Get deployment architecture from Pulumi outputs
          cd infrastructure
          pulumi stack select ${{ env.ENVIRONMENT }}
          
          # Check if auto-scaling is enabled for this stack
          ARCHITECTURE=$(pulumi config get infrastructure:architecture || echo "single")
          echo "Deployment architecture: $ARCHITECTURE"
          
          if [ "$ARCHITECTURE" = "autoscaling" ]; then
            echo "🔄 Deploying to Auto Scaling Group architecture..."
            
            # Get the Auto Scaling Group name for the environment
            ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
              --query "AutoScalingGroups[?contains(Tags[?Key==\`Name\`].Value, \`chatbot\`) && contains(Tags[?Key==\`Environment\`].Value, \`${{ env.ENVIRONMENT }}\`)].AutoScalingGroupName" \
              --output text)
            
            if [ -z "$ASG_NAME" ]; then
              echo "❌ Auto Scaling Group not found for environment: ${{ env.ENVIRONMENT }}"
              exit 1
            else
              echo "✅ Found Auto Scaling Group: $ASG_NAME"
              
              # Start instance refresh to deploy new containers
              REFRESH_ID=$(aws autoscaling start-instance-refresh \
                --auto-scaling-group-name $ASG_NAME \
                --preferences '{
                  "InstanceWarmup": 300,
                  "MinHealthyPercentage": 50,
                  "MaxHealthyPercentage": 200,
                  "CheckpointPercentages": [50],
                  "CheckpointDelay": 300
                }' \
                --query 'InstanceRefreshId' \
                --output text)
              
              echo "🚀 Started instance refresh: $REFRESH_ID"
              echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV
              echo "ASG_NAME=$ASG_NAME" >> $GITHUB_ENV
              echo "DEPLOYMENT_TYPE=autoscaling" >> $GITHUB_ENV
            fi
            
          else
            echo "🖥️ Deploying to single EC2 instance architecture..."
            
            # Get the single EC2 instance ID for the environment
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=$(pulumi config get infrastructure:name || echo "chatbot")-dev-server" \
                "Name=tag:Environment,Values=${{ env.ENVIRONMENT }}" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" \
              --output text)
            
            if [ "$INSTANCE_ID" = "null" ] || [ -z "$INSTANCE_ID" ]; then
              echo "❌ No running EC2 instance found for environment: ${{ env.ENVIRONMENT }}"
              exit 1
            else
              echo "✅ Found EC2 instance: $INSTANCE_ID"
              
              # Create a command to update the container on the instance
              COMMAND_ID=$(aws ssm send-command \
                --instance-ids $INSTANCE_ID \
                --document-name "AWS-RunShellScript" \
                --parameters 'commands=[
                  "cd /opt/chatbot-dev",
                  "echo \"Pulling latest container image...\"",
                  "./deploy.sh",
                  "echo \"Container deployment completed\"",
                  "docker ps | grep chatbot || echo \"Warning: chatbot container not found\"",
                  "curl -f http://localhost:8000/health || echo \"Warning: health check failed\""
                ]' \
                --comment "Deploy new chatbot container - GitHub Actions Run ${{ github.run_id }}" \
                --timeout-seconds 600 \
                --query 'Command.CommandId' \
                --output text)
              
              echo "🚀 Started SSM command execution: $COMMAND_ID"
              echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
              echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV
              echo "DEPLOYMENT_TYPE=single" >> $GITHUB_ENV
            fi
          fi
          
          cd ..

